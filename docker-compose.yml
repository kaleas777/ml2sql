services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_change_this_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "python -m scripts.seed_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://app:app_change_this_password@db:5432/studentdb
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      API_KEY: ${API_KEY}
      ALLOWED_ORIGINS: http://localhost:8501
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      BACKEND_URL: http://api:8000
      BACKEND_API_KEY: ${API_KEY}
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  postgres_data:

